<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RCA Chat Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #fff;
      border-right: 1px solid #dde3ea;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
      overflow-y: auto;
    }

    .sidebar-title {
      background: #1a2332;
      color: #f5f0e8;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      text-align: center;
    }

    #new-chat-btn {
      background: linear-gradient(135deg, #1a2332, #2d3f55);
      color: #f5f0e8;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    #new-chat-btn:hover { opacity: 0.85; }

    .divider { border: none; border-top: 1px solid #dde3ea; }

    #chat-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .chat-item {
      background: #f4f6f9;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      font-size: 0.82rem;
      color: #1a2332;
      transition: background 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item:hover, .chat-item.active {
      background: #1a2332;
      color: #f5f0e8;
      border-color: #1a2332;
    }

    .empty-state {
      color: #6b7c93;
      font-size: 0.82rem;
      text-align: center;
      padding: 1rem;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #dde3ea;
    }

    /* Main area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #header {
      background: linear-gradient(135deg, #1a2332 0%, #243447 100%);
      padding: 1rem 2rem;
      color: #f5f0e8;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(26,35,50,0.2);
      flex-shrink: 0;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: #f4f6f9; }
    #messages::-webkit-scrollbar-thumb { background: #c9b99a; border-radius: 3px; }

    .welcome {
      text-align: center;
      margin: auto;
      color: #6b7c93;
    }
    .welcome .icon { font-size: 3.5rem; opacity: 0.6; margin-bottom: 0.75rem; }
    .welcome h2 { color: #1a2332; font-size: 1.4rem; margin-bottom: 0.4rem; }
    .welcome p { font-size: 0.95rem; }

    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 72%;
      padding: 0.85rem 1.1rem;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.65;
    }

    .msg-row.user .bubble {
      background: #1a2332;
      color: #f5f0e8;
      border-radius: 18px 18px 4px 18px;
    }

    .msg-row.assistant .bubble {
      background: #fff;
      color: #1a2332;
      border: 1px solid #dde3ea;
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 1px 3px rgba(26,35,50,0.08);
    }

    /* Markdown inside assistant bubble */
    .bubble h2 { font-size: 1rem; margin: 1rem 0 0.4rem; color: #1a2332; }
    .bubble p { margin-bottom: 0.5rem; }
    .bubble ul, .bubble ol { padding-left: 1.2rem; margin-bottom: 0.5rem; }
    .bubble code { background: #f0f2f5; padding: 0.1rem 0.3rem; border-radius: 4px; font-size: 0.85rem; }
    .bubble pre { background: #f0f2f5; padding: 0.75rem; border-radius: 6px; overflow-x: auto; margin-bottom: 0.5rem; }

    .typing { display: flex; gap: 5px; align-items: center; padding: 0.85rem 1.1rem; }
    .typing span {
      width: 8px; height: 8px; background: #8a9bb0;
      border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* Input area */
    #input-area {
      padding: 1rem 2rem;
      background: #f4f6f9;
      border-top: 1px solid #dde3ea;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      border: 1px solid #dde3ea;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      resize: none;
      outline: none;
      background: #fff;
      color: #1a2332;
      max-height: 140px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(26,35,50,0.06);
    }
    #user-input:focus { border-color: #1a2332; }
    #user-input::placeholder { color: #8a9bb0; }

    #send-btn {
      background: linear-gradient(135deg, #1a2332, #2d3f55);
      color: #f5f0e8;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.4rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sidebar-title">💬 Chat History</div>
  <button id="new-chat-btn" onclick="newChat()">🆕 New Chat</button>
  <hr class="divider"/>
  <div id="chat-list"><div class="empty-state">No chat history yet.<br>Start a new conversation!</div></div>
</div>

<!-- Main -->
<div id="main">
  <div id="header">💬 RCA Chat Assistant</div>
  <div id="messages">
    <div class="welcome" id="welcome">
      <div class="icon">🤖</div>
      <h2>Hello! I'm your RCA Assistant</h2>
      <p>I can help analyze error logs, troubleshoot issues, or answer technical questions.</p>
    </div>
  </div>
  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="Type your message or paste error log..."></textarea>
    <button id="send-btn" onclick="sendMessage()">Send ➤</button>
  </div>
</div>

<script>
  const BACKEND = "http://localhost:8000";

  let sessions = {};       // { id: { title, messages: [] } }
  let currentId = null;

  function generateId() {
    return Math.random().toString(36).slice(2, 10);
  }

  function newChat() {
    const id = generateId();
    sessions[id] = { title: "New Chat", messages: [] };
    currentId = id;
    renderSidebar();
    renderMessages();
  }

  function switchChat(id) {
    currentId = id;
    renderSidebar();
    renderMessages();
  }

  function renderSidebar() {
    const list = document.getElementById("chat-list");
    const ids = Object.keys(sessions).reverse();
    if (!ids.length) {
      list.innerHTML = '<div class="empty-state">No chat history yet.<br>Start a new conversation!</div>';
      return;
    }
    list.innerHTML = ids.map(id => `
      <div class="chat-item ${id === currentId ? 'active' : ''}" onclick="switchChat('${id}')">
        ${sessions[id].title}
      </div>
    `).join("");
  }

  function renderMessages() {
    const container = document.getElementById("messages");
    if (!currentId || !sessions[currentId].messages.length) {
      container.innerHTML = `
        <div class="welcome" id="welcome">
          <div class="icon">🤖</div>
          <h2>Hello! I'm your RCA Assistant</h2>
          <p>I can help analyze error logs, troubleshoot issues, or answer technical questions.</p>
        </div>`;
      return;
    }
    container.innerHTML = sessions[currentId].messages.map(m => `
      <div class="msg-row ${m.role}">
        <div class="bubble">${m.role === 'assistant' ? marked.parse(m.content) : escapeHtml(m.content)}</div>
      </div>
    `).join("");
    container.scrollTop = container.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function addTypingIndicator() {
    const container = document.getElementById("messages");
    const el = document.createElement("div");
    el.className = "msg-row assistant";
    el.id = "typing";
    el.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById("typing");
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    if (!currentId) newChat();

    // Add user message
    sessions[currentId].messages.push({ role: "user", content: text });
    if (sessions[currentId].messages.length === 1) {
      sessions[currentId].title = text.slice(0, 30) + (text.length > 30 ? "..." : "");
    }
    input.value = "";
    input.style.height = "auto";
    renderSidebar();
    renderMessages();

    // Show typing
    addTypingIndicator();
    document.getElementById("send-btn").disabled = true;

    try {
      const res = await fetch(`${BACKEND}/execute`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTypingIndicator();
      sessions[currentId].messages.push({ role: "assistant", content: data.response });
    } catch (err) {
      removeTypingIndicator();
      sessions[currentId].messages.push({ role: "assistant", content: `⚠️ Error: ${err.message}. Make sure backend is running at ${BACKEND}` });
    }

    document.getElementById("send-btn").disabled = false;
    renderMessages();
  }

  // Auto-resize textarea
  document.getElementById("user-input").addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 140) + "px";
  });

  // Send on Enter (Shift+Enter for newline)
  document.getElementById("user-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
